[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-pub"
version = "0.1.0"
description = "RADAR PUB - Business Intelligence + Opportunity Intelligence Engine for PUB Holding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "PUB Holding", email = "engineering@pubholding.com" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
exclude = ["tests*", "scripts*", "docs*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"